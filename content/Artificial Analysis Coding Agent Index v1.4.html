<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AI 코딩 에이전트를 성능, 비용, 작업 시간 기준으로 비교하는 화면">
<title>Artificial Analysis Coding Agent Index v1.4 — 코딩 에이전트 비교</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f7fa;
    --surface: #ffffff;
    --surface-muted: #f8fafc;
    --text: #162032;
    --muted: #5c687a;
    --line: #d9e0e9;
    --blue: #2256d4;
    --blue-soft: #eaf0ff;
    --teal: #087b6d;
    --teal-soft: #e4f7f2;
    --amber: #a55c00;
    --amber-soft: #fff4e0;
    --purple: #6c43b6;
    --purple-soft: #f0eaff;
    --coral: #bf543e;
    --coral-soft: #fff0ec;
    --danger: #b42318;
    --focus: #0b6bcb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141c;
      --surface: #171c26;
      --surface-muted: #1c2330;
      --text: #ecf1fb;
      --muted: #b1bdce;
      --line: #303a49;
      --blue: #8cabff;
      --blue-soft: #202d50;
      --teal: #62d5bf;
      --teal-soft: #153c37;
      --amber: #ffc16c;
      --amber-soft: #4a3517;
      --purple: #c3a6ff;
      --purple-soft: #362657;
      --coral: #ffab96;
      --coral-soft: #4d2822;
      --danger: #ffb4aa;
      --focus: #8fc3ff;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }

  html { background: var(--page); }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  button, input, select { font: inherit; }

  button, a, input, select { -webkit-tap-highlight-color: transparent; }

  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .shell { max-width: 1480px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 36px) 48px; }

  .hero {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    justify-content: space-between;
    padding: 28px 0 24px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    color: var(--blue);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  h1, h2, h3, p { margin-top: 0; }

  h1 {
    max-width: 760px;
    margin: 5px 0 8px;
    font-size: clamp(26px, 3.2vw, 39px);
    line-height: 1.13;
    letter-spacing: -.04em;
  }

  h1 span { color: var(--blue); }

  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  .chip, .badge {
    display: inline-flex;
    align-items: center;
    min-height: 25px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    color: var(--muted);
    background: var(--surface);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding-top: 3px; }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 11px;
    color: var(--text);
    background: var(--surface);
    cursor: pointer;
    font-weight: 750;
    text-decoration: none;
    white-space: nowrap;
  }

  .button:hover { border-color: var(--blue); color: var(--blue); }

  .button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }

  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .chart-panel {
    margin-top: 22px;
    overflow: hidden;
  }

  .chart-tabs {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    padding: 10px 12px 0;
    border-bottom: 1px solid var(--line);
    background: var(--surface-muted);
    scrollbar-width: thin;
  }

  .chart-tab {
    flex: 0 0 auto;
    min-height: 40px;
    margin-bottom: -1px;
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 7px 7px 0 0;
    padding: 8px 14px;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
  }

  .chart-tab:hover { color: var(--blue); }

  .chart-tab.is-active {
    border-color: var(--line);
    color: var(--text);
    background: var(--surface);
  }

  .chart-content { padding: 20px 18px 14px; }

  .chart-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 13px;
  }

  .chart-heading h2 {
    margin: 0 0 3px;
    font-size: 20px;
    letter-spacing: -.025em;
  }

  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 11px;
    margin-top: 9px;
  }

  .chart-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
    white-space: nowrap;
  }

  .chart-legend-swatch {
    width: 9px;
    height: 9px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
  }

  .chart-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .chart-scale-toggle {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface-muted);
  }

  .chart-scale-button {
    min-height: 30px;
    border: 0;
    border-right: 1px solid var(--line);
    padding: 5px 9px;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
  }

  .chart-scale-button:last-child { border-right: 0; }
  .chart-scale-button:hover { color: var(--blue); }
  .chart-scale-button.is-active { color: var(--text); background: var(--surface); }

  .chart-count {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    color: var(--muted);
    background: var(--surface-muted);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .chart-actions .chart-count { margin-top: 0; }

  .bar-chart-scroll { overflow-x: auto; padding-bottom: 2px; }

  .bar-chart {
    display: block;
    width: 100%;
    min-width: 1180px;
    height: 450px;
  }

  .chart-grid-line { stroke: var(--line); stroke-dasharray: 2 5; }
  .chart-baseline { stroke: var(--line); }
  .chart-axis-break { stroke: var(--muted); stroke-width: 1.5; }
  .chart-axis-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-value-label { fill: var(--text); font-size: 11px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .chart-model-label { fill: var(--text); font-size: 10.5px; font-weight: 750; }
  .chart-agent-label { fill: var(--muted); font-size: 9.5px; font-weight: 650; }
  .chart-bar { transition: opacity .12s ease; }
  .chart-bar-group:hover .chart-bar, .chart-bar-group:focus .chart-bar { opacity: .76; }

  .data-panel { margin-top: 24px; overflow: hidden; }

  .toolbar {
    display: grid;
    grid-template-columns: minmax(220px, 1.45fr) repeat(3, minmax(132px, .7fr)) auto;
    gap: 10px;
    align-items: end;
    padding: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-muted);
  }

  .control { display: grid; gap: 5px; min-width: 0; }
  .control label { color: var(--muted); font-size: 11px; font-weight: 800; }

  .control input, .control select {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 9px;
    color: var(--text);
    background: var(--surface);
  }

  .control input:hover, .control select:hover { border-color: color-mix(in srgb, var(--blue) 50%, var(--line)); }

  .toolbar-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }

  .count { color: var(--text); font-weight: 850; font-variant-numeric: tabular-nums; }

  .table-scroll {
    overflow: auto;
    max-height: min(68vh, 800px);
  }

  table { width: 100%; min-width: 1320px; border-collapse: collapse; font-size: 12px; }

  th, td {
    padding: 10px 11px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  th {
    position: sticky;
    z-index: 1;
    top: 0;
    background: var(--surface);
    color: var(--muted);
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .025em;
    text-align: left;
    text-transform: uppercase;
  }

  th.number, td.number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:focus-within { z-index: 4; }

  .header-cell {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  th.number .header-cell { justify-content: flex-end; }

  .sort-header {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border: 0;
    padding: 0;
    color: inherit;
    background: transparent;
    cursor: pointer;
    font: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-align: inherit;
    text-transform: inherit;
  }

  .sort-header:hover,
  .sort-header.is-active { color: var(--blue); }

  .sort-indicator {
    display: inline-grid;
    place-items: center;
    width: 12px;
    font-size: 12px;
    line-height: 1;
    opacity: 0;
  }

  .sort-header.is-active .sort-indicator { opacity: 1; }

  .header-tooltip {
    position: relative;
    display: inline-flex;
    align-items: center;
    border: 0;
    padding: 0;
    color: inherit;
    background: transparent;
    cursor: help;
    font: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-align: inherit;
    text-transform: inherit;
  }

  .tooltip-icon {
    display: inline-grid;
    place-items: center;
    width: 15px;
    height: 15px;
    border: 1px solid currentColor;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 900;
    line-height: 1;
  }

  .tooltip {
    position: absolute;
    z-index: 10;
    top: calc(100% + 9px);
    left: 50%;
    width: max-content;
    max-width: min(285px, calc(100vw - 34px));
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1.5;
    opacity: 0;
    pointer-events: none;
    text-align: left;
    text-transform: none;
    transform: translateX(-50%) translateY(-3px);
    transition: opacity .14s ease, transform .14s ease, visibility .14s ease;
    visibility: hidden;
    white-space: normal;
  }

  .header-tooltip:hover .tooltip,
  .header-tooltip:focus-visible .tooltip,
  .header-tooltip.is-open .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    visibility: visible;
  }

  th:nth-last-child(-n + 2) .tooltip {
    right: 0;
    left: auto;
    transform: translateY(-3px);
  }

  th:nth-last-child(-n + 2) .header-tooltip:hover .tooltip,
  th:nth-last-child(-n + 2) .header-tooltip:focus-visible .tooltip,
  th:nth-last-child(-n + 2) .header-tooltip.is-open .tooltip {
    transform: translateY(0);
  }

  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: var(--surface-muted); }
  tbody tr.leader { background: color-mix(in srgb, var(--blue-soft) 55%, var(--surface)); }

  .agent-name { font-weight: 800; white-space: nowrap; }
  .model-name { min-width: 260px; font-weight: 700; }
  .score { color: var(--blue); font-size: 13px; font-weight: 900; }

  .badge { margin: 1px 3px 1px 0; min-height: 22px; padding: 2px 7px; font-size: 10px; }
  .badge.quality { color: var(--blue); background: var(--blue-soft); border-color: transparent; }
  .badge.value { color: var(--teal); background: var(--teal-soft); border-color: transparent; }
  .badge.fast { color: var(--purple); background: var(--purple-soft); border-color: transparent; }

  .empty { display: none; padding: 34px 16px; color: var(--muted); text-align: center; }
  .empty.show { display: block; }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-top: 18px;
    color: var(--muted);
    font-size: 12px;
  }

  footer a { color: inherit; text-underline-offset: 3px; }
  footer a:hover { color: var(--blue); }

  @media (max-width: 1080px) {
    .hero { display: block; }
    .hero-actions { justify-content: flex-start; margin-top: 16px; }
    .toolbar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .toolbar .search { grid-column: span 3; }
  }

  @media (max-width: 680px) {
    .shell { padding: 18px 13px 34px; }
    .hero { padding-top: 15px; }
    .toolbar { grid-template-columns: 1fr; }
    .toolbar .search { grid-column: auto; }
    .button { width: 100%; }
    .hero-actions { display: grid; grid-template-columns: 1fr; }
    .chart-content { padding: 16px 12px 11px; }
    .chart-heading { display: block; }
    .chart-actions { justify-content: flex-start; flex-wrap: wrap; margin-top: 10px; }
    .chart-count { display: inline-flex; margin-top: 10px; }
    .toolbar-footer { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div>
      <div class="eyebrow">AI Coding Agent 비교</div>
      <h1>코딩 에이전트 비교 <span>v1.4</span></h1>
      <div class="hero-meta">
        <span class="chip">68개 선택지</span>
        <span class="chip">성능 · 비용 · 속도 비교</span>
      </div>
    </div>
    <div class="hero-actions">
      <button class="button primary" id="downloadCsv" type="button">현재 보기 CSV</button>
    </div>
  </header>

  <section class="panel chart-panel" aria-labelledby="chartTitle">
    <div class="chart-tabs" role="tablist" aria-label="비교 지표 선택">
      <button class="chart-tab is-active" id="tab-index" type="button" role="tab" aria-selected="true" aria-controls="chartView" data-chart-metric="index">Index</button>
      <button class="chart-tab" id="tab-deepswe" type="button" role="tab" aria-selected="false" aria-controls="chartView" data-chart-metric="deepSWE" tabindex="-1">DeepSWE</button>
      <button class="chart-tab" id="tab-terminal" type="button" role="tab" aria-selected="false" aria-controls="chartView" data-chart-metric="terminalBench" tabindex="-1">Terminal-Bench v2.1</button>
      <button class="chart-tab" id="tab-atlas" type="button" role="tab" aria-selected="false" aria-controls="chartView" data-chart-metric="sweAtlas" tabindex="-1">SWE-Atlas-QnA</button>
      <button class="chart-tab" id="tab-cost" type="button" role="tab" aria-selected="false" aria-controls="chartView" data-chart-metric="cost" tabindex="-1">작업당 비용</button>
    </div>
    <div class="chart-content" id="chartView" role="tabpanel" aria-labelledby="tab-index">
      <div class="chart-heading">
        <div>
          <h2 id="chartTitle">Index</h2>
          <div class="chart-legend" id="chartLegend" aria-label="차트에 표시된 에이전트 계열 색상"></div>
        </div>
        <div class="chart-actions">
          <div class="chart-scale-toggle" id="chartScaleToggle" role="group" aria-label="Y축 표시 범위">
            <button class="chart-scale-button is-active" type="button" data-chart-scale="focus" aria-pressed="true">차이 강조</button>
            <button class="chart-scale-button" type="button" data-chart-scale="full" aria-pressed="false">0부터 보기</button>
          </div>
          <span class="chart-count" id="chartCount">상위 15개</span>
        </div>
      </div>
      <div class="bar-chart-scroll" id="chartScroll" tabindex="0" aria-label="Index 상위 15개 세로 막대 차트">
        <svg class="bar-chart" id="barChart" role="img" viewBox="0 0 1280 450" preserveAspectRatio="xMinYMin meet"></svg>
      </div>
    </div>
  </section>

  <section class="panel data-panel" aria-labelledby="table-title">
    <div class="toolbar">
      <div class="control search">
        <label for="q">검색</label>
        <input id="q" type="search" placeholder="Agent, 모델 또는 reasoning 설정">
      </div>
      <div class="control">
        <label for="agent">Agent</label>
        <select id="agent"><option value="">모든 Agent</option></select>
      </div>
      <div class="control">
        <label for="minIndex">최소 Index</label>
        <select id="minIndex">
          <option value="0">전체</option>
          <option value="60">60 이상</option>
          <option value="55">55 이상</option>
          <option value="50">50 이상</option>
          <option value="45">45 이상</option>
        </select>
      </div>
      <div class="control">
        <label for="maxCost">예산 (작업당)</label>
        <select id="maxCost">
          <option value="">제한 없음</option>
          <option value="1">$1 이하</option>
          <option value="3">$3 이하</option>
          <option value="5">$5 이하</option>
        </select>
      </div>
      <button class="button" id="resetFilters" type="button">초기화</button>
    </div>
    <div class="toolbar-footer">
      <div><span class="count" id="count">—</span> <span id="filterSummary">전체 선택지</span></div>
    </div>
    <div class="table-scroll" tabindex="0" aria-label="Coding Agent Index v1.4 세부 측정값 표">
      <table>
        <thead>
          <tr>
            <th aria-sort="none"><button class="sort-header" type="button" data-sort-key="agent" data-label="Agent" aria-label="Agent 오름차순 정렬"><span>Agent</span><span class="sort-indicator" aria-hidden="true">↕</span></button></th>
            <th aria-sort="none"><button class="sort-header" type="button" data-sort-key="model" data-label="모델" aria-label="모델 오름차순 정렬"><span>모델</span><span class="sort-indicator" aria-hidden="true">↕</span></button></th>
            <th class="number" aria-sort="descending"><span class="header-cell"><button class="sort-header is-active" type="button" data-sort-key="index" data-label="Index" aria-label="Index 내림차순 정렬"><span>Index</span><span class="sort-indicator" aria-hidden="true">↓</span></button><button class="header-tooltip" type="button" aria-describedby="tip-index" aria-expanded="false" aria-label="Index 설명"><span class="tooltip-icon" aria-hidden="true">?</span><span class="tooltip" id="tip-index" role="tooltip">전체 코딩 성능을 한 점수로 보여줍니다. DeepSWE, TB v2.1, SWE-Atlas 결과를 합친 값이며 높을수록 좋습니다.</span></button></span></th>
            <th class="number" aria-sort="none"><span class="header-cell"><button class="sort-header" type="button" data-sort-key="deepSWE" data-label="DeepSWE" aria-label="DeepSWE 내림차순 정렬"><span>DeepSWE</span><span class="sort-indicator" aria-hidden="true">↕</span></button><button class="header-tooltip" type="button" aria-describedby="tip-deepswe" aria-expanded="false" aria-label="DeepSWE 설명"><span class="tooltip-icon" aria-hidden="true">?</span><span class="tooltip" id="tip-deepswe" role="tooltip">실제 코드베이스에서 기능 구현과 버그 수정처럼 긴 작업을 끝까지 해내는 능력을 봅니다. 높을수록 좋습니다.</span></button></span></th>

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function (character) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character];

}

const agentColorFamilies = {
  'Codex': { hue: 214, spread: 28 },
  'Claude Code': { hue: 4, spread: 24 },
  'Antigravity SDK': { hue: 184, spread: 18 },
  'Cursor CLI': { hue: 272, spread: 20 },

};

const agentModelOrder = Object.create(null);
rows.forEach(function (row) {
  if (!agentModelOrder[row.agent]) agentModelOrder[row.agent] = [];
  if (!agentModelOrder[row.agent].includes(row.model)) agentModelOrder[row.agent].push(row.model);
});
Object.keys(agentModelOrder).forEach(function (agent) {
  agentModelOrder[agent].sort(function (a, b) { return a.localeCompare(b, 'en'); });
});

function colorForAgent(agent, model) {
  const family = agentColorFamilies[agent] || { hue: 215, spread: 0 };
  const models = agentModelOrder[agent] || [model];
  const position = Math.max(0, models.indexOf(model));
  const count = models.length;
  const placement = count > 1 ? ((position * 7) % count) / (count - 1) : .5;
  const hue = (Math.round(family.hue - family.spread / 2 + family.spread * placement) + 360) % 360;
  const lightness = Math.round(36 + (position % 6) * 4);
  const saturation = 68 + (position % 3) * 6;
  return 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)';
}

function colorForRow(row) { return colorForAgent(row.agent, row.model); }

function createSvgElement(name, attributes, text) {
  const element = document.createElementNS('http://www.w3.org/2000/svg', name);
  Object.keys(attributes || {}).forEach(function (key) { element.setAttribute(key, attributes[key]); });
  if (text !== undefined) element.textContent = text;
  return element;
}

function chartRowsFor(metric) {
  return rows.slice().sort(function (a, b) {
    const difference = Number(a[metric.field]) - Number(b[metric.field]);
    if (difference === 0) return b.index - a.index;
    return metric.order === 'asc' ? difference : -difference;
  }).slice(0, 15);
}

function niceChartMaximum(value) {
  if (!value || value <= 0) return 1;
  const magnitude = Math.pow(10, Math.floor(Math.log(value) / Math.LN10));
  const fraction = value / magnitude;
  const steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (let index = 0; index < steps.length; index += 1) {
    if (fraction <= steps[index]) return steps[index] * magnitude;
  }
  return 10 * magnitude;
}

function chartMaximum(metric, chartRows) {
  const maximum = Math.max.apply(null, chartRows.map(function (row) { return Number(row[metric.field]); }));
  if (metric.field === 'cost') return niceChartMaximum(maximum * 1.1);
  return Math.min(100, Math.max(5, Math.ceil((maximum + 1) / 5) * 5));
}

function chartDomain(metric, chartRows) {
  const values = chartRows.map(function (row) { return Number(row[metric.field]); });
  const minimum = Math.min.apply(null, values);
  const maximum = Math.max.apply(null, values);
  const spread = maximum - minimum;
  const canEmphasizeDifference = metric.field !== 'cost' && spread / Math.max(maximum, 1) < .3;

  if (currentChartScale !== 'focus' || !canEmphasizeDifference) {
    return { min: 0, max: chartMaximum(metric, chartRows), truncated: false, canEmphasizeDifference: canEmphasizeDifference };
  }

  const step = spread <= 8 ? 2 : 5;
  const padding = Math.max(spread * .16, .6);
  const lower = Math.max(0, Math.floor((minimum - padding) / step) * step);
  const upper = Math.min(100, Math.ceil((maximum + padding) / step) * step);
  return {
    min: lower,
    max: Math.max(upper, lower + step),
    truncated: lower > 0,
    canEmphasizeDifference: canEmphasizeDifference
  };
}

function wrapChartText(value, maxLength, maxLines) {
  const words = String(value).replace(/\s+/g, ' ').trim().split(' ');
  const lines = [];
  let line = '';
  words.forEach(function (word) {
    const candidate = line ? line + ' ' + word : word;
    if (candidate.length <= maxLength || !line) {
      line = candidate;
      return;
    }
    lines.push(line);
    line = word;
  });
  if (line) lines.push(line);
  if (lines.length <= maxLines) return lines;
  const clipped = lines.slice(0, maxLines);
  clipped[maxLines - 1] = clipped[maxLines - 1].replace(/[.…]+$/, '') + '…';
  return clipped;
}

function renderChartLegend(chartRows) {
  const visibleAgents = Array.from(new Set(chartRows.map(function (row) { return row.agent; })));
  $('chartLegend').innerHTML = visibleAgents.map(function (agent) {
    return '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:' + colorForAgent(agent, (agentModelOrder[agent] || [''])[0]) + '"></span>' + escapeHtml(agent) + '</span>';
  }).join('');
}

function renderChart() {
  const metric = chartMetrics[currentChartMetric];
  const chartRows = chartRowsFor(metric);
  const svg = $('barChart');
  const width = 1280;
  const height = 450;
  const margin = { top: 40, right: 22, bottom: 160, left: 64 };
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const plotBottom = margin.top + plotHeight;
  const domain = chartDomain(metric, chartRows);
  const range = domain.max - domain.min;
  const tickCount = 4;

  $('chartTitle').textContent = metric.label;
  $('chartCount').textContent = metric.countLabel;
  $('chartScroll').setAttribute('aria-label', metric.label + ' ' + metric.countLabel + ' 세로 막대 차트');
  $('chartScaleToggle').hidden = metric.field === 'cost';
  renderChartLegend(chartRows);
  svg.replaceChildren();
  svg.setAttribute('aria-labelledby', 'chartSvgTitle chartSvgDescription');
  svg.appendChild(createSvgElement('title', { id: 'chartSvgTitle' }, metric.label + ' ' + metric.countLabel));
  svg.appendChild(createSvgElement('desc', { id: 'chartSvgDescription' }, '모델별 값을 세로 막대로 비교합니다.'));
  svg.appendChild(createSvgElement('text', { x: margin.left, y: 18, class: 'chart-axis-label' }, metric.label));

  for (let index = 0; index <= tickCount; index += 1) {
    const value = domain.min + range * index / tickCount;
    const y = plotBottom - plotHeight * index / tickCount;
    svg.appendChild(createSvgElement('line', {
      x1: margin.left, y1: y, x2: width - margin.right, y2: y,
      class: index === 0 ? 'chart-baseline' : 'chart-grid-line'
    }));
    svg.appendChild(createSvgElement('text', {
      x: margin.left - 10, y: y + 4, 'text-anchor': 'end', class: 'chart-axis-label'
    }, metric.format(value)));
  }

  if (domain.truncated) {
    svg.appendChild(createSvgElement('line', {
      x1: margin.left - 6, y1: plotBottom - 13, x2: margin.left + 4, y2: plotBottom - 3, class: 'chart-axis-break'
    }));
    svg.appendChild(createSvgElement('line', {
      x1: margin.left + 2, y1: plotBottom - 13, x2: margin.left + 12, y2: plotBottom - 3, class: 'chart-axis-break'
    }));
  }

  const slotWidth = plotWidth / chartRows.length;
  const barWidth = Math.min(56, slotWidth * .62);
  chartRows.forEach(function (row, index) {
    const value = Number(row[metric.field]);
    const barHeight = Math.max(0, (value - domain.min) / range * plotHeight);
    const x = margin.left + slotWidth * index + (slotWidth - barWidth) / 2;
    const y = plotBottom - barHeight;
    const group = createSvgElement('g', {
      class: 'chart-bar-group', tabindex: '0', role: 'img',
      'aria-label': compactName(row) + ': ' + metric.format(value)
    });
    group.appendChild(createSvgElement('title', {}, compactName(row) + ': ' + metric.format(value)));
    group.appendChild(createSvgElement('rect', {
      x: x, y: y, width: barWidth, height: barHeight, rx: 4,
      class: 'chart-bar', fill: colorForRow(row)
    }));
    group.appendChild(createSvgElement('text', {
      x: x + barWidth / 2, y: Math.max(margin.top + 12, y - 8),
      'text-anchor': 'middle', class: 'chart-value-label'
    }, metric.format(value)));

    const modelLines = wrapChartText(row.model, 17, 2);
    modelLines.forEach(function (line, lineIndex) {
      group.appendChild(createSvgElement('text', {
        x: x + barWidth / 2, y: plotBottom + 24 + lineIndex * 14,
        'text-anchor': 'middle', class: 'chart-model-label'
      }, line));
    });
    const agentLabel = wrapChartText(row.agent, 18, 1)[0];
    group.appendChild(createSvgElement('text', {
      x: x + barWidth / 2, y: plotBottom + 24 + Math.max(modelLines.length, 1) * 14 + 15,
      'text-anchor': 'middle', class: 'chart-agent-label'
    }, agentLabel));
    svg.appendChild(group);
  });
}

function activateChartMetric(metric) {
  currentChartMetric = metric;
  updateChartTabs();
  renderChart();
}

function activateChartScale(scale) {
  currentChartScale = scale;
  updateChartScaleButtons();
  renderChart();
}

function setupChartTabs() {
  const tabs = Array.from(document.querySelectorAll('.chart-tab'));
  tabs.forEach(function (button, index) {
    button.addEventListener('click', function () { activateChartMetric(button.dataset.chartMetric); });
    button.addEventListener('keydown', function (event) {
      let nextIndex = index;
      if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
      else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
      else if (event.key === 'Home') nextIndex = 0;
      else if (event.key === 'End') nextIndex = tabs.length - 1;
      else return;
      event.preventDefault();
      activateChartMetric(tabs[nextIndex].dataset.chartMetric);
      tabs[nextIndex].focus();
    });
  });
}

function setupChartScaleControls() {
  document.querySelectorAll('.chart-scale-button').forEach(function (button) {
    button.addEventListener('click', function () { activateChartScale(button.dataset.chartScale); });
  });
}

function defaultSortDirection(key) {
  return ['agent', 'model', 'tokens', 'timeMinutes', 'steps', 'cost'].includes(key) ? 'asc' : 'desc';
}

function signalRank(row) {
  let rank = 0;
  if (row.index >= 65) rank += 4;
  else if (row.index >= 60) rank += 3;
  if (row.index >= 50 && row.cost <= 1) rank += 2;
  if (row.index >= 50 && row.timeMinutes <= 7) rank += 1;
  return rank;
}

function sortTableRows(rowsToSort) {
  const copied = rowsToSort.slice();
  const key = sortState.key;
  const direction = sortState.direction === 'asc' ? 1 : -1;

  return copied.sort(function (a, b) {
    let comparison = 0;
    if (key === 'agent' || key === 'model') {
      comparison = String(a[key]).localeCompare(String(b[key]), 'ko');
    }
    else if (key === 'signal') {
      comparison = signalRank(a) - signalRank(b);
    }
    else {
      comparison = Number(a[key]) - Number(b[key]);
    }

    if (comparison === 0) return b.index - a.index;
    return comparison * direction;
  });
}

function updateSortHeaders() {
  document.querySelectorAll('.sort-header').forEach(function (button) {
    const active = button.dataset.sortKey === sortState.key;
    const direction = active ? sortState.direction : defaultSortDirection(button.dataset.sortKey);
    const directionText = direction === 'asc' ? '오름차순' : '내림차순';
    const indicator = button.querySelector('.sort-indicator');
    const header = button.closest('th');

    button.classList.toggle('is-active', active);
    button.setAttribute('aria-label', button.dataset.label + ' ' + directionText + ' 정렬');
    if (indicator) indicator.textContent = active ? (direction === 'asc' ? '↑' : '↓') : '↕';
    if (header) header.setAttribute('aria-sort', active ? (direction === 'asc' ? 'ascending' : 'descending') : 'none');
  });
}

function setupTableSorting() {
  document.querySelectorAll('.sort-header').forEach(function (button) {
    button.addEventListener('click', function () {
      const key = button.dataset.sortKey;
      if (sortState.key === key) {
        sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
      }
      else {
        sortState.key = key;
        sortState.direction = defaultSortDirection(key);
      }
      updateSortHeaders();
      renderTable();
    });
  });
}

function badges(row) {
  const items = [];
  if (row.index >= 65) items.push('<span class="badge quality">선두 성능</span>');
  else if (row.index >= 60) items.push('<span class="badge quality">상위 성능</span>');
  if (row.index >= 50 && row.cost <= 1) items.push('<span class="badge value">비용 효율</span>');
  if (row.index >= 50 && row.timeMinutes <= 7) items.push('<span class="badge fast">고속</span>');
  if (!items.length) items.push('<span class="badge">비교 대상</span>');
  return items.join('');
}

function renderTable() {
  const needle = $('q').value.trim().toLowerCase();
  const agent = $('agent').value;
  const minimum = Number($('minIndex').value);
  const costLimit = $('maxCost').value === '' ? Infinity : Number($('maxCost').value);

  visibleRows = rows.filter(function (row) {
    const text = (row.agent + ' ' + row.model).toLowerCase();
    return (!needle || text.includes(needle))
      && (!agent || row.agent === agent)
      && row.index >= minimum
      && row.cost <= costLimit;
  });
  visibleRows = sortTableRows(visibleRows);

  $('tbody').innerHTML = visibleRows.map(function (row) {
    const leader = row.index >= 65 ? ' leader' : '';
    return '<tr class="' + leader.trim() + '">' +
      '<td class="agent-name">' + escapeHtml(row.agent) + '</td>' +
      '<td class="model-name">' + escapeHtml(row.model) + '</td>' +
      '<td class="number score">' + formatIndex(row.index) + '</td>' +
      '<td class="number">' + formatIndex(row.deepSWE) + '%</td>' +
      '<td class="number">' + formatIndex(row.terminalBench) + '%</td>' +
      '<td class="number">' + formatIndex(row.sweAtlas) + '%</td>' +
      '<td class="number">' + formatTokens(row.tokens) + '</td>' +
      '<td class="number">' + formatTime(row.timeMinutes) + '</td>' +
      '<td class="number">' + formatSteps(row.steps) + '</td>' +
      '<td class="number">' + formatMoney(row.cost) + '</td>' +
      '<td>' + badges(row) + '</td>' +
    '</tr>';
  }).join('');

  $('count').textContent = visibleRows.length + ' / ' + rows.length;
  $('filterSummary').textContent = visibleRows.length === rows.length ? '전체 선택지' : '선택한 조건의 결과';
  $('empty').classList.toggle('show', visibleRows.length === 0);
}

function populateAgentFilter() {
  Array.from(new Set(rows.map(function (row) { return row.agent; }))).sort().forEach(function (agent) {
    const option = document.createElement('option');
    option.value = agent;
    option.textContent = agent;
    $('agent').appendChild(option);
  });
}

function setupHeaderTooltips() {
  document.querySelectorAll('.header-tooltip').forEach(function (button) {
    button.addEventListener('click', function () {
      const shouldOpen = !button.classList.contains('is-open');
      document.querySelectorAll('.header-tooltip').forEach(function (item) {
        item.classList.remove('is-open');
        item.setAttribute('aria-expanded', 'false');
      });
      if (shouldOpen) {
        button.classList.add('is-open');
        button.setAttribute('aria-expanded', 'true');
      }
    });

    button.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        button.classList.remove('is-open');
        button.setAttribute('aria-expanded', 'false');
        button.blur();
      }
    });
  });
}

function csvCell(value) {
  const text = String(value);
  return '"' + text.replace(/"/g, '""') + '"';
}

function downloadCsv() {
  const header = ['Agent', 'Model / 설정', 'Index', 'DeepSWE (%)', 'Terminal-Bench v2.1 (%)', 'SWE-Atlas-QnA (%)', 'Tokens / task', '활성 시간 / task (분)', 'Steps / task', 'API 비용 / task (USD)'];
  const lines = [header].concat(visibleRows.map(function (row) {
    return [row.agent, row.model, row.index, row.deepSWE, row.terminalBench, row.sweAtlas, row.tokens, row.timeMinutes, row.steps, row.cost];
  })).map(function (line) { return line.map(csvCell).join(','); });
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'Artificial Analysis Coding Agent Index v1.4 ' + snapshotLabel + '.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);
}

['q', 'agent', 'minIndex', 'maxCost'].forEach(function (id) {
  $(id).addEventListener(id === 'q' ? 'input' : 'change', renderTable);
});

$('resetFilters').addEventListener('click', function () {
  $('q').value = '';
  $('agent').value = '';
  $('minIndex').value = '0';
  $('maxCost').value = '';
  sortState.key = 'index';
  sortState.direction = 'desc';
  updateSortHeaders();
  renderTable();
  $('q').focus();
});

$('downloadCsv').addEventListener('click', downloadCsv);
setupHeaderTooltips();
setupTableSorting();
setupChartTabs();
setupChartScaleControls();
updateSortHeaders();
populateAgentFilter();
updateChartTabs();
updateChartScaleButtons();
renderChart();
renderTable();
</script>
</body>
